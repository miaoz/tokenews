<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f3ed" />
    <meta
      name="description"
      content="Tokenews is the AI-era directory of models, makers and products: each model's real price per token, each maker's lineup and what every subscription includes."
    />
    <meta name="keywords" content="AI model directory, AI makers, AI products, AI news, AI 模型目录, AI 资讯, AI API pricing, LLM price per million tokens, AI subscription limits, coding plan comparison, Claude pricing, ChatGPT pricing, Gemini pricing, DeepSeek pricing, Kimi pricing, GLM pricing, Qwen pricing, 大模型价格, API 定价, 订阅额度" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Tokenews" />
    <meta property="og:title" content="Tokenews · Directory and news of models, makers and products for the AI era" />
    <meta
      property="og:description"
      content="Every AI model, maker and product in one directory, with real per-token prices set against independent leaderboards. Open data, traceable sources."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tokenews.xyz/" />
    <meta property="og:site_name" content="Tokenews" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:image" content="https://tokenews.xyz/og/pareto-en.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2880" />
    <meta property="og:image:height" content="1928" />
    <meta property="og:image:alt" content="Price–capability Pareto chart of AI subscriptions" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tokenews · Directory and news of models, makers and products for the AI era" />
    <meta
      name="twitter:description"
      content="Every AI model, maker and product in one directory, with real per-token prices set against independent leaderboards. Open data, traceable sources."
    />
    <meta name="twitter:image" content="https://tokenews.xyz/og/pareto-en.png" />
    <meta name="twitter:image:alt" content="Price–capability Pareto chart of AI subscriptions" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="canonical" href="https://tokenews.xyz/" />
    <link rel="alternate" type="text/plain" title="llms.txt" href="https://tokenews.xyz/llms.txt" />
    <!--seo:jsonld-->
    <script>
      try {
        var t = localStorage.getItem("pricing-theme");
        if (t !== "dark" && t !== "light")
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = t;
        if (t === "dark")
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#0f1113");
      } catch (e) {}
      // Start the dataset download in parallel with the JavaScript bundle.
      window.__siteData = fetch("/data/site.json").then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
      window.__siteData.catch(function () {});
    </script>
    <title>Tokenews · Directory and news of models, makers and products for the AI era</title>
  </head>
  <body>
    <!-- Plain links for crawlers and no-JS readers; React replaces them on mount. -->
    <div id="root"><!--seo:index--></div>
    <noscript>
      Tokenews needs JavaScript for the interactive explorer. Every maker,
      provider and model also has a static page linked above. Data source:
      <a href="https://github.com/Fei2411/real-api-pricing"
        >github.com/Fei2411/real-api-pricing</a
      >
      / 交互式图表需要 JavaScript；每个厂商、供应商和模型的静态页面见上方链接。数据来源：
      <a href="https://github.com/Fei2411/real-api-pricing">GitHub 仓库</a>。
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
