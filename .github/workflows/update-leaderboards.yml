name: Update independent leaderboards
on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tokenews-data-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run leaderboards:audit -- --allow-partial
      - run: npm run pareto:update -- --allow-partial
      - run: npm run leaderboards:update
      - run: npm run build && npm test && npm run check
      - name: Preserve source audit and discovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-discovery
          path: |
            data/leaderboards/discovery.json
            data/leaderboards/audit.json
            data/leaderboards/refresh-status.json
      - name: Commit validated snapshots
        id: push
        run: |
          git add data/leaderboards/snapshots.json data/leaderboards/discovery.json data/leaderboards/audit.json data/leaderboards/current.json data/leaderboards/history data/leaderboards/refresh-status.json
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update independent leaderboard snapshots'
          git push origin HEAD:main
          echo 'pushed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: update
    # Rebuild date-sensitive plan prices even when source snapshots are unchanged.
    if: needs.update.result == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.sha || github.sha }}
    secrets: inherit
