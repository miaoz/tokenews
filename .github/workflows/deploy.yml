name: Deploy

# Builds, tests and checks the site, then deploys it to Cloudflare:
# the static-assets deployment `tokenews` (tokenews.xyz), and tells IndexNow
# which pages changed (scripts/indexnow.mjs).
# www redirects through a Cloudflare zone Redirect Rule, outside this deployment.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or branch to deploy
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tokenews.xyz
    steps:
      - uses: actions/checkout@v7
        with:
          # The sync workflow deploys the commit it just pushed.
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      # Compare with the live sitemap before it is replaced.
      - name: Find changed pages for IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs diff > "$RUNNER_TEMP/indexnow.txt"
      - name: Deploy to Cloudflare
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs submit "$RUNNER_TEMP/indexnow.txt"
