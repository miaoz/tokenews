name: Watch official announcements and coding plans
on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tokenews-data-updates
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run coding-plans:watch -- --allow-partial
      - run: npm run build && npm test && npm run check
      - name: Archive source status and pending changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-plan-watch
          path: |
            data/coding-plans/watch-report.json
            data/coding-plans/watch-state.json
          retention-days: 30
      - name: Publish validated watch results
        id: push
        run: |
          git add data/coding-plans/watch-state.json data/coding-plans/watch-report.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update official announcement and coding plan watch'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: watch
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.watch.outputs.sha }}
    secrets: inherit
